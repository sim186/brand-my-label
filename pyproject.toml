[project]
name = "brand-my-label"
version = "0.1.0"
description = "Put your shop logo on shipping labels (Vinted, Poste, InPost, BRT, DPD...) wherever it fits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5",
    "pdfplumber>=0.11",
    "reportlab>=4",
    "pillow>=10.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "posthog>=6",
]
dev = ["pytest>=8"]

[project.scripts]
brand-my-label = "brand_my_label.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brand_my_label"]
